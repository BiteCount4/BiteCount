<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d5016">
    <title>BiteCount - Hitung Kalori Semua Makanan</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --pink-light: #ffc0cb;
            --pink-medium: #ffb3c1;
            --pink-dark: #ff69b4;
            --green-dark: #2d5016;
            --green-medium: #3d6b1f;
            --bg-light: #fff5f7;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, #ffffff 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Header dengan logo lebih besar */
        .app-header {
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-medium) 100%);
            color: white;
            padding: 20px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .app-title {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .app-logo {
            height: 80px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
        
        .app-subtitle {
            font-size: 1rem;
            opacity: 0.95;
            margin-top: 5px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        /* Chat Container */
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 15px 100px 15px;
            min-height: calc(100vh - 180px);
        }
        
        /* Welcome Message */
        .welcome-card {
            background: linear-gradient(135deg, var(--pink-light) 0%, var(--pink-medium) 100%);
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.25);
            animation: slideIn 0.5s ease-out;
            border: 2px solid white;
        }
        
        .welcome-card h5 {
            color: var(--green-dark);
            font-weight: 800;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .welcome-card p {
            color: var(--green-dark);
            margin-bottom: 15px;
            font-size: 1rem;
            line-height: 1.6;
        }
        
        .feature-badge {
            display: inline-block;
            background: white;
            color: var(--green-dark);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            margin: 5px 8px 5px 0;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid var(--pink-dark);
        }
        
        /* Chat Messages */
        .message {
            margin-bottom: 20px;
            animation: messageSlide 0.3s ease-out;
            display: flex;
            gap: 12px;
        }
        
        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        
        .bot-avatar {
            background: linear-gradient(135deg, var(--green-dark), var(--green-medium));
            color: white;
            overflow: hidden;
            padding: 0;
        }
        
        .bot-avatar span {
            font-size: 28px;
            line-height: 45px;
        }
        
        .user-avatar {
            background: linear-gradient(135deg, var(--pink-dark), var(--pink-medium));
            color: white;
        }
        
        .message-content {
            flex: 1;
        }
        
        .message-bubble {
            padding: 14px 18px;
            border-radius: 20px;
            max-width: 85%;
            word-wrap: break-word;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .user-message {
            justify-content: flex-end;
        }
        
        .user-message .message-bubble {
            background: linear-gradient(135deg, var(--pink-light), var(--pink-medium));
            color: var(--green-dark);
            margin-left: auto;
            font-weight: 500;
            border: 1px solid white;
        }
        
        .bot-message .message-bubble {
            background: white;
            color: #333;
            border: 2px solid var(--green-dark);
        }
        
        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 6px;
            padding: 0 8px;
        }
        
        /* Calorie Result Card */
        .calorie-card {
            background: linear-gradient(135deg, #fff, #f8f9fa);
            border: 3px solid var(--pink-medium);
            border-radius: 18px;
            padding: 18px;
            margin-top: 12px;
        }
        
        .calorie-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--pink-dark);
            text-align: center;
            margin: 10px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }
        
        .calorie-label {
            text-align: center;
            color: var(--green-dark);
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        /* Meal Plan Card */
        .meal-plan-card {
            background: linear-gradient(135deg, #ffffff, #f8f9fa);
            border: 2px solid var(--green-medium);
            border-radius: 18px;
            padding: 18px;
            margin-top: 12px;
        }
        
        .day-header {
            background: var(--green-dark);
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 1.1rem;
        }
        
        .meal-item {
            background: var(--bg-light);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 5px solid var(--pink-medium);
        }
        
        .meal-name {
            font-weight: 700;
            color: var(--green-dark);
            margin-bottom: 5px;
        }
        
        .meal-calories {
            font-size: 0.9rem;
            color: var(--pink-dark);
            font-weight: 700;
            margin-top: 5px;
        }
        
        /* Exercise Card */
        .exercise-card {
            background: linear-gradient(135deg, var(--pink-light), var(--pink-medium));
            border-radius: 18px;
            padding: 18px;
            margin-top: 12px;
        }
        
        .exercise-item {
            background: white;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            position: relative;
        }
        
        .exercise-icon {
            font-size: 1.8rem;
            flex-shrink: 0;
        }
        
        .exercise-name {
            font-weight: 700;
            color: var(--green-dark);
            flex: 1;
            font-size: 1rem;
        }
        
        .exercise-duration {
            font-size: 0.9rem;
            color: var(--pink-dark);
            font-weight: 700;
            text-align: right;
            margin-right: 45px;
            flex-shrink: 0;
        }
        
        .exercise-save-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--green-dark);
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            border: 2px solid white;
        }
        
        .exercise-save-btn:hover {
            background: var(--green-medium);
            transform: translateY(-50%) scale(1.1);
        }
        
        /* Input Area */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 3px solid var(--pink-light);
            padding: 18px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
        }
        
        .input-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }
        
        .message-input {
            flex: 1;
            border: 2px solid var(--pink-medium);
            border-radius: 30px;
            padding: 14px 22px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .message-input:focus {
            border-color: var(--pink-dark);
            box-shadow: 0 0 0 4px rgba(255, 105, 180, 0.15);
        }
        
        .send-button {
            background: linear-gradient(135deg, var(--green-dark), var(--green-medium));
            color: white;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.3rem;
        }
        
        .send-button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 18px rgba(45, 80, 22, 0.35);
        }
        
        .send-button:active {
            transform: scale(0.95);
        }
        
        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            overflow-x: auto;
            scrollbar-width: none;
        }
        
        .quick-actions::-webkit-scrollbar {
            display: none;
        }
        
        .quick-action-btn {
            background: white;
            border: 2px solid var(--pink-medium);
            color: var(--green-dark);
            padding: 10px 20px;
            border-radius: 30px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        
        .quick-action-btn:hover {
            background: var(--pink-light);
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(255, 105, 180, 0.25);
        }
        
        /* Typing Indicator */
        .typing-indicator {
            display: none;
            padding: 14px 20px;
            background: white;
            border: 2px solid var(--green-dark);
            border-radius: 20px;
            width: fit-content;
        }
        
        .typing-indicator span {
            height: 10px;
            width: 10px;
            background: var(--green-dark);
            border-radius: 50%;
            display: inline-block;
            margin: 0 3px;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-12px);
            }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive */
        @media (max-width: 576px) {
            .app-title {
                font-size: 1.6rem;
            }
            .app-logo {
                height: 65px;
            }
            .message-bubble {
                max-width: 92%;
            }
            .welcome-card {
                padding: 22px;
            }
            .feature-badge {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
            .exercise-duration {
                margin-right: 40px;
            }
        }
        
        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Suggestion Chips */
        .suggestion-chip {
            display: inline-block;
            background: #e9ecef;
            border-radius: 20px;
            padding: 6px 16px;
            margin: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid var(--pink-medium);
            transition: all 0.2s;
        }
        
        .suggestion-chip:hover {
            background: var(--pink-light);
            border-color: var(--pink-dark);
        }

        /* ===== FITUR CATATAN & REMINDER (TAMBAHAN) ===== */
        .notes-button {
            background: var(--pink-dark);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            border: 2px solid white;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        
        .notes-button:hover {
            transform: scale(1.05);
            background: #ff4d6d;
        }
        
        .notes-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 380px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 20px rgba(0,0,0,0.15);
            z-index: 2000;
            padding: 25px 20px;
            overflow-y: auto;
            animation: slideRight 0.3s ease;
            border-left: 5px solid var(--pink-light);
        }
        
        @keyframes slideRight {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        
        .notes-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            animation: fadeIn 0.2s ease;
        }
        
        .notification {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--green-dark), var(--green-medium));
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 9999;
            animation: slideUp 0.3s ease, fadeOut 0.3s ease 2.2s forwards;
            border: 2px solid white;
        }
        
        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        
        @keyframes fadeOut {
            to { opacity: 0; transform: translate(-50%, -10px); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .reminder-box {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            font-size: 0.9rem;
        }

        /* Tombol hapus per item */
        .delete-item-btn {
            background: none;
            border: none;
            color: #dc3545;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 5px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }
        
        .delete-item-btn:hover {
            opacity: 1;
            transform: scale(1.1);
            color: #c82333;
        }
        
        .food-item, .exercise-item-note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }
        
        .food-item {
            border-left: 4px solid var(--pink-medium);
        }
        
        .exercise-item-note {
            border-left: 4px solid var(--green-dark);
        }
        
        .food-item:hover, .exercise-item-note:hover {
            background: #e9ecef;
        }
        
        .item-info {
            flex: 1;
        }
        
        .item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>

        function addFoodNote(foodName, calories, portion = '') {
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            userNotes.foods.push({ name: foodName, calories: Math.round(calories), portion: portion, date: dateStr, timestamp: now.getTime() });

            const now = new Date();

            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => { if (notif.parentNode) notif.remove(); }, 2500);

                <div style="margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h4 style="color: var(--green-dark); font-weight: 700; margin: 0; font-size: 1rem;"><i class="bi bi-activity"></i> Olahraga Tersimpan</h4>
                        <button onclick="if(confirm('Hapus semua catatan olahraga?')) { userNotes.exercises = []; saveNotes(); toggleNotesPanel(); showNotification('🗑️ Semua catatan olahraga dihapus'); }" style="background: none; border: 1px solid #dc3545; color: #dc3545; border-radius: 20px; padding: 4px 12px; font-size: 0.7rem; font-weight: 600;">Hapus Semua</button>
                    </div>
                    <div style="max-height: 250px; overflow-y: auto; padding-right: 5px;">${exerciseItemsHtml}</div>
                </div>
                <div class="reminder-box"><i class="bi bi-bell-fill" style="color: #ffc107; margin-right: 8px;"></i><strong>Reminder Olahraga:</strong><br>${todayExercises.length === 0 ? 'Kamu belum mencatat olahraga hari ini! Yuk gerak minimal 15-30 menit 💪' : `Kamu sudah olahraga ${todayExercises.length} kali hari ini! Hebat! 🔥`}</div>
            `;
            document.body.appendChild(panel);
        }

        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');

        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function quickMessage(text) { messageInput.value = text; sendMessage(); }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            messageInput.value = '';
            showTypingIndicator();
            setTimeout(() => { hideTypingIndicator(); processMessage(message); }, 1000);
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            if (sender === 'user') {
                messageDiv.innerHTML = `<div class="message-content"><div class="message-bubble">${escapeHtml(text)}</div><div class="message-time">${time}</div></div><div class="message-avatar user-avatar"><i class="bi bi-person-fill"></i></div>`;
            } else {
                messageDiv.innerHTML = `<div class="message-avatar bot-avatar"><span>🥑</span></div><div class="message-content"><div class="message-bubble">${text}</div><div class="message-time">${time}</div></div>`;
            }
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message bot-message';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `<div class="message-avatar bot-avatar"><span>🥑</span></div><div class="message-content"><div class="typing-indicator" style="display: flex;"><span></span><span></span><span></span></div></div>`;
            chatContainer.appendChild(indicator);
            scrollToBottom();
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function processMessage(message) {
            const lowerMessage = message.toLowerCase();
            if (lowerMessage.includes('meal plan') || lowerMessage.includes('menu') || lowerMessage.includes('rencana makan')) {
                const calorieMatch = message.match(/(\d+)\s*k?kal/i);
                if (calorieMatch) { generateMealPlan(parseInt(calorieMatch[1])); return; }
                else { addMessage('📋 Berapa target kalori harian kamu? Contoh: <strong>"meal plan 1200 kkal"</strong>, <strong>"meal plan 1500 kkal"</strong>, atau <strong>"menu 1800 kalori"</strong> 😊', 'bot'); return; }
            }
            if (lowerMessage.includes('olahraga') || lowerMessage.includes('exercise') || lowerMessage.includes('workout') || lowerMessage.includes('bakar kalori')) {
                let level = 'menengah';
                if (lowerMessage.includes('pemula') || lowerMessage.includes('ringan')) level = 'pemula';
                else if (lowerMessage.includes('intensif') || lowerMessage.includes('berat') || lowerMessage.includes('advanced')) level = 'intensif';
                generateExerciseRecommendation(level); return;
            }
            calculateCalories(message);
        }

        function getSuggestions(input) {
            const lowerInput = input.toLowerCase();
            const suggestions = [];
            for (const food of Object.keys(foodDatabase)) {
                if (food.includes(lowerInput) || lowerInput.includes(food)) { suggestions.push(food); if (suggestions.length >= 5) break; }
            }
            return suggestions;
        }

        function calculateCalories(message) {
            let totalCalories = 0;
            let foundFood = null;
            let amount = 100;
            let unit = 'gram';
            let bestMatchLength = 0;
            const lowerMessage = message.toLowerCase();
            const amountMatch = message.match(/(\d+[.,]?\d*)\s*([a-zA-Z]+)?/i);
            if (amountMatch) {
                amount = parseFloat(amountMatch[1].replace(',', '.'));
                if (amountMatch[2]) {
                    unit = amountMatch[2].toLowerCase();
                    if (unitConversions[unit]) amount = amount * unitConversions[unit];
                }
            }
            for (const [food, caloriesPer100g] of Object.entries(foodDatabase)) {
                if (lowerMessage.includes(food) && food.length > bestMatchLength) {
                    bestMatchLength = food.length;
                    totalCalories = (caloriesPer100g * amount) / 100;
                    foundFood = food;
                }
            }
            if (foundFood) {
                const displayAmount = amountMatch ? parseFloat(amountMatch[1].replace(',', '.')) : 100;
                const displayUnit = amountMatch && amountMatch[2] ? amountMatch[2].toLowerCase() : 'gram';
                const response = `<div><p style="margin-bottom: 12px;">✅ <strong>Berhasil!</strong> Saya temukan data kalorinya:</p><div class="calorie-card"><div class="calorie-label">🍽️ Total Kalori</div><div class="calorie-value">${Math.round(totalCalories)} kkal</div><div style="text-align: center; margin-top: 8px;"><span style="background: var(--green-dark); color: white; padding: 6px 16px; border-radius: 30px; font-weight: 600;">${foundFood.charAt(0).toUpperCase() + foundFood.slice(1)}</span><div style="margin-top: 8px; color: #666; font-size: 0.9rem;">📏 ${displayAmount} ${displayUnit}</div></div></div><div style="display: flex; gap: 10px; margin-top: 15px;"><button onclick="addFoodNote('${foundFood}', ${totalCalories}, '${displayAmount} ${displayUnit}'); showNotification('✅ Tersimpan!');" style="flex: 1; background: var(--green-dark); color: white; border: none; padding: 10px; border-radius: 30px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;"><i class="bi bi-bookmark-plus"></i> Simpan Makanan</button><button onclick="toggleNotesPanel();" style="flex: 1; background: var(--pink-light); color: var(--green-dark); border: 2px solid var(--pink-dark); padding: 10px; border-radius: 30px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;"><i class="bi bi-journal"></i> Lihat Catatan</button></div><div style="margin-top: 15px; padding: 12px; background: #e8f5e9; border-radius: 12px; border-left: 5px solid var(--green-dark);">💡 <strong>Tips Kesehatan:</strong> ${getHealthTip(totalCalories)}</div></div>`;
                addMessage(response, 'bot');
            } else {
                const suggestions = getSuggestions(message);
                let suggestionHtml = '';
                if (suggestions.length > 0) {
                    suggestionHtml = '<div style="margin-top: 15px;"><strong>🔍 Mungkin maksud kamu:</strong><br>';
                    suggestions.slice(0, 5).forEach(s => { suggestionHtml += `<span class="suggestion-chip" onclick="quickMessage('${s} 100 gram')">${s}</span>`; });
                    suggestionHtml += '</div>';
                }
                addMessage(`<div><p>😕 Maaf, saya belum punya data untuk <strong>"${escapeHtml(message)}"</strong>.</p><p style="margin-top: 10px;">🌍 Database saya punya <strong>10.000+ makanan</strong> dari seluruh dunia. Coba ketik:</p><ul style="margin-top: 8px;"><li>Nama makanan dalam bahasa Indonesia/Inggris</li><li>Contoh: nasi goreng, pizza, sushi, rendang, pho, tacos, kebab, curry</li><li>Sertakan jumlah: "nasi putih 150 gram", "pizza 2 slice"</li></ul>${suggestionHtml}</div>`, 'bot');
            }
        }

        function getHealthTip(calories) {
            if (calories < 100) return 'Makanan rendah kalori! Cocok untuk camilan sehat atau diet 🥗';
            else if (calories < 300) return 'Kalori sedang. Bagus untuk porsi makan ringan atau pendamping makanan utama 👍';
            else if (calories < 500) return 'Kalori cukup tinggi. Ideal untuk makanan utama yang mengenyangkan 🍽️';
            else if (calories < 800) return 'Kalori tinggi! Sebaiknya dibagi menjadi 2 porsi atau diimbangi dengan olahraga 💪';
            else return 'Kalori sangat tinggi! Makanan ini untuk acara spesial. Jangan lupa olahraga ekstra! 🔥';
        }

        function generateMealPlan(targetCalories) {
            const calOptions = [1200, 1500, 1800, 2000];
            let closestCalorie = calOptions.reduce((prev, curr) => Math.abs(curr - targetCalories) < Math.abs(prev - targetCalories) ? curr : prev);
            const days = ['Senin', 'Selasa', 'Rabu'];
            let response = `<div><div style="display: flex; align-items: center; gap: 12px; margin-bottom: 15px;"><span style="font-size: 2.5rem;">📅</span><div><h5 style="margin: 0; color: var(--green-dark); font-weight: 800;">Meal Plan ${closestCalorie} kkal</h5><p style="margin: 0; color: #666;">Rencana makan sehat 7 hari • Internasional</p></div></div>`;
            const breakfastCal = Math.round(closestCalorie * 0.3);
            const lunchCal = Math.round(closestCalorie * 0.35);
            const dinnerCal = Math.round(closestCalorie * 0.35);
            const snackCal = Math.round(closestCalorie * 0.1);
            days.forEach(day => {
                response += `<div class="meal-plan-card"><div class="day-header">${day}</div>`;
                const meals = [
                    { time: 'Sarapan', items: [`Oatmeal 50g (${Math.round(50*68/100)} kkal)`, 'Pisang 1 buah (89 kkal)', 'Telur rebus 1 butir (78 kkal)', 'Teh tanpa gula (1 kkal)'], total: breakfastCal },
                    { time: 'Snack Pagi', items: ['Apel 1 buah (95 kkal)', 'Yogurt 100g (59 kkal)'], total: snackCal },
                    { time: 'Makan Siang', items: ['Nasi merah 100g (111 kkal)', 'Ayam panggang 100g (165 kkal)', 'Tumis brokoli 100g (34 kkal)'], total: lunchCal },
                    { time: 'Snack Sore', items: ['Apel 1 buah (95 kkal)', 'Yogurt 100g (59 kkal)'], total: snackCal },
                    { time: 'Makan Malam', items: [`Ikan panggang 150g (${Math.round(150*206/100)} kkal)`, 'Sayur bayam 100g (23 kkal)', `Tempe 50g (${Math.round(50*193/100)} kkal)`], total: dinnerCal },
                ];
                meals.forEach(meal => {
                    response += `<div class="meal-item"><div class="meal-name">⏰ ${meal.time}</div>${meal.items.map(item => `<div style="font-size: 0.9rem; margin-left: 10px; color: #444;">• ${item}</div>`).join('')}<div class="meal-calories">🔥 Total: ${meal.total} kkal</div></div>`;
                });
                const totalDaily = meals.reduce((sum, meal) => sum + meal.total, 0);
                response += `<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 10px; border-top: 2px dashed var(--pink-medium);"><span style="font-weight: 600; color: var(--green-dark);">📊 Total Harian</span><span style="font-weight: 800; color: var(--pink-dark); font-size: 1.2rem;">${totalDaily} kkal</span></div></div>`;
            });
            response += `<p style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 12px; border-left: 5px solid #ffc107;">💧 <strong>Tips Hidrasi:</strong> Minum air putih minimal 8 gelas/hari.<br>🏃‍♀️ <strong>Aktivitas Fisik:</strong> Lakukan olahraga 30 menit setiap hari.<br>🥗 <strong>Variasi Makanan:</strong> Konsumsi berbagai makanan dari seluruh dunia!</p><p style="margin-top: 10px; font-size: 0.9rem; color: #666;">⚡ Ingin meal plan lengkap 7 hari? Ketik "meal plan lengkap ${closestCalorie} kkal"</p></div>`;
            addMessage(response, 'bot');
        }

        function generateExerciseRecommendation(level) {
            const exerciseList = exercises[level];
            const levelName = level === 'pemula' ? 'Pemula' : level === 'menengah' ? 'Menengah' : 'Intensif';
            const levelEmoji = level === 'pemula' ? '🌱' : level === 'menengah' ? '⭐' : '🔥';
            let response = `<div><div style="display: flex; align-items: center; gap: 12px; margin-bottom: 15px;"><span style="font-size: 2.5rem;">🏋️‍♀️</span><div><h5 style="margin: 0; color: var(--green-dark); font-weight: 800;">Rekomendasi Olahraga</h5><p style="margin: 0; color: #666;">Level ${levelName} ${levelEmoji}</p></div></div><div class="exercise-card">`;
            exerciseList.forEach(exercise => {
                response += `<div class="exercise-item"><span class="exercise-icon">${exercise.icon}</span><div class="exercise-name">${exercise.name}</div><div class="exercise-duration">⏱️ ${exercise.duration}<br>🔥 ${exercise.calories}</div><button class="exercise-save-btn" onclick="addExerciseNote('${exercise.name}', '${exercise.duration}', ${parseInt(exercise.calories)}); showNotification('💪 Tersimpan!');" title="Simpan catatan"><i class="bi bi-plus-lg"></i></button></div>`;
            });
            response += `</div><div style="display: flex; gap: 10px; margin-top: 15px;"><button onclick="toggleNotesPanel();" style="flex: 1; background: white; color: var(--green-dark); border: 2px solid var(--green-dark); padding: 12px; border-radius: 30px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;"><i class="bi bi-journal"></i> Lihat Catatan</button></div><div style="margin-top: 20px; padding: 15px; background: #d1ecf1; border-radius: 12px; border-left: 5px solid #17a2b8;">💡 <strong>Tips Olahraga:</strong><br>• Lakukan pemanasan 5-10 menit sebelum olahraga<br>• Jaga hidrasi dengan minum air putih<br>• Lakukan pendinginan setelah olahraga<br>• Konsisten 3-4x seminggu untuk hasil maksimal!</div></div>`;
            addMessage(response, 'bot');
        }

        function scrollToBottom() {
            setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 100);
        }

        window.onload = function() {
            addMessage('Halo! 👋 Saya BiteCount, asisten pintar dengan database <strong>10.000+ makanan dari seluruh dunia</strong>. Coba ketik makanan favorit kamu!', 'bot');
            setTimeout(() => {
                const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const todayExercises = userNotes.exercises.filter(e => e.date === today);
                if (todayExercises.length === 0) {
                    addMessage('💪 <strong>Reminder:</strong> Kamu belum mencatat olahraga hari ini! Yuk sempatkan gerak 15-30 menit untuk kesehatan!', 'bot');
                }
            }, 3000);
        };
    </script>
</body>
</html>
